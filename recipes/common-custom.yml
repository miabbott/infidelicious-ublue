modules:
  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://cli.github.com/packages/rpm/gh-cli.repo
    install:
      packages:
        - cockpit
        - edk2-ovmf
        - gamemode
        - gh
        - glab
        - guestfs-tools
        - ifuse
        - libvirt
        - lm_sensors
        - qemu-kvm
        - ramalama
        - restic
        - swtpm
        - tailscale
        - virt-install
        - virt-manager
        - virt-viewer
    remove:
      packages:
        - waydroid
        - waydroid-selinux

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.localsend.localsend_app
